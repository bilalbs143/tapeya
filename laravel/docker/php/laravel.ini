date.timezone=UTC
display_errors=Off
log_errors=On

memory_limit=1024M
upload_max_filesize=1000M
post_max_size=1000M
max_execution_time=1800
default_socket_timeout=3600
request_terminate_timeout=1800

; Imagick Configuration for QR Code Generation
extension=imagick
imagick.progress_monitor=0
imagick.locale_fix=1
