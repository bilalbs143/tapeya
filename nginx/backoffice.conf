# ============================================================
# backoffice – backoffice.tapeya.com (Angular) — production mirror
# Deploy to: /etc/nginx/sites-available/backoffice.conf
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name backoffice.tapeya.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name backoffice.tapeya.com;

    ssl_certificate     /etc/letsencrypt/live/api.tapeya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tapeya.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Extra: block this admin panel from search engines entirely.
    add_header X-Robots-Tag "noindex, nofollow" always;

    root  /var/www/tapeya/backoffice/dist/backoffice/browser;
    index index.html;

    access_log /var/log/nginx/backoffice-access.log main buffer=16k flush=5s;
    error_log  /var/log/nginx/backoffice-error.log warn;

    # ── index.html ────────────────────────────────────────────
    # Angular CLI also outputs hashed filenames; the shell index.html
    # must stay uncached so deployments are instant for all users.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
        try_files $uri =404;
    }

    # ── Hashed bundles & assets ───────────────────────────────
    # Angular CLI appends a content hash to every chunk name,
    # so these are safe to cache for 1 year.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|map)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";

        # Serve pre-compressed Brotli/Gzip if angular-cli build
        # produced them (ng build --configuration production).
        gzip_static on;

        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── SPA fallback ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Block hidden files ────────────────────────────────────
    location ~ /\.(?!well-known) { deny all; }
}
