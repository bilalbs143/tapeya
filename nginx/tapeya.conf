# Tapeya – main nginx config
# api: api.tapeya.com (PHP/Laravel)
# app: tapeya.com (React/Vite SPA)
# backoffice: backoffice.tapeya.com (Angular SPA)

# Upstream for PHP-FPM (adjust socket or host:port to match your setup)
upstream php_fpm {
    server unix:/run/php/php-fpm.sock;
    # server 127.0.0.1:9000;
}

# ---------------------------------------------------------------------------
# api – api.tapeya.com (Laravel/PHP)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.tapeya.com;

    root /var/www/tapeya/api/public;
    index index.php;

    # Security / logs
    access_log /var/log/nginx/api-access.log;
    error_log  /var/log/nginx/api-error.log;

    # Max body size (uploads)
    client_max_body_size 64M;

    # Laravel: front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php_fpm;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param PHP_VALUE "upload_max_filesize=64M \n post_max_size=64M";
    }

    # Deny access to hidden / sensitive
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~ ^/\.env {
        deny all;
    }
}

# ---------------------------------------------------------------------------
# app – tapeya.com (React SPA, Vite build → dist)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name tapeya.com www.tapeya.com;

    root /var/www/tapeya/app/dist;
    index index.html;

    access_log /var/log/nginx/app-access.log;
    error_log  /var/log/nginx/app-error.log;

    # Static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: all routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ---------------------------------------------------------------------------
# backoffice – backoffice.tapeya.com (Angular SPA)
# Angular 17+ application builder: output in dist/backoffice/browser
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name backoffice.tapeya.com;

    # Angular application builder outputs to dist/backoffice/browser
    root /var/www/tapeya/backoffice/dist/backoffice/browser;
    index index.html;

    access_log /var/log/nginx/backoffice-access.log;
    error_log  /var/log/nginx/backoffice-error.log;

    # Static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: all routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
