# ============================================================
# Tapeya nginx — production site includes (HTTPS)
# ============================================================
# Per-vhost source of truth (mirrors /etc/nginx/sites-available):
#   api.conf        → api.tapeya.com
#   app.conf        → tapeya.com (+ www redirect)
#   graphics.conf   → graphics.tapeya.com
#   backoffice.conf → backoffice.tapeya.com
#
# Prefer copying each file into sites-available (same as production),
# or include them from http {} after adjusting cert paths:
#
#   include /var/www/tapeya/nginx/api.conf;
#   include /var/www/tapeya/nginx/app.conf;
#   include /var/www/tapeya/nginx/graphics.conf;
#   include /var/www/tapeya/nginx/backoffice.conf;
#
# Notes:
# - HTTP :80 blocks are ACME + redirect only (no app content on plaintext).
# - api.conf defines fastcgi_cache_path + upstream php_fpm (must load once).
# - Certs: api/app/backoffice share /etc/letsencrypt/live/api.tapeya.com/
#          graphics uses /etc/letsencrypt/live/graphics.tapeya.com/
# - Create cache dir once: mkdir -p /var/cache/nginx/api && chown www-data:www-data /var/cache/nginx/api
# ============================================================

include /var/www/tapeya/nginx/api.conf;
include /var/www/tapeya/nginx/app.conf;
include /var/www/tapeya/nginx/graphics.conf;
include /var/www/tapeya/nginx/backoffice.conf;
