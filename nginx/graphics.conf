# graphics – graphics.tapeya.com (broadcast graphics artifact, Chrome 86 / vMix)
# Build: cd app && npm run build:graphics:production
# Deploy dist-graphics/ to /var/www/tapeya/app/dist-graphics
# Standalone copy of the graphics server block in nginx/tapeya.conf

server {
    listen 80;
    listen [::]:80;
    server_name graphics.tapeya.com;

    root /var/www/tapeya/app/dist-graphics;
    index graphics.html;

    access_log /var/log/nginx/graphics-access.log;
    error_log  /var/log/nginx/graphics-error.log;

    # Bootstrap shell: always revalidate so deploys propagate after browser-source reload.
    location = /graphics.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Hashed build assets — long cache (filenames change on every deploy).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Signed access tokens: /{sessionId}-{expires}-{signature}
    location ~ ^/\d+-\d+-[a-f0-9]{64}/?$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /graphics.html =404;
    }

    location = / {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
