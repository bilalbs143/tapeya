# ============================================================
# graphics – graphics.tapeya.com (broadcast graphics) — production mirror
# Deploy to: /etc/nginx/sites-available/graphics.conf
# Root: /var/www/tapeya/app/dist-graphics
# ============================================================

# HTTP — ACME + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name graphics.tapeya.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — production graphics host
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name graphics.tapeya.com;

    ssl_certificate     /etc/letsencrypt/live/graphics.tapeya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/graphics.tapeya.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    root  /var/www/tapeya/app/dist-graphics;
    index index.html;

    access_log /var/log/nginx/graphics-access.log main buffer=16k flush=5s;
    error_log  /var/log/nginx/graphics-error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Bootstrap shell: always revalidate so deploys propagate after browser-source reload.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
        try_files $uri =404;
    }

    # Hashed build assets — long cache (filenames change on every deploy).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Signed access tokens: /{sessionId}-{expires}-{signature}
    location ~ "^/\d+-\d+-[a-f0-9]{64}/?$" {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
