# ============================================================
# api – api.tapeya.com (Laravel) — production mirror
# Deploy to: /etc/nginx/sites-available/api.conf
# ============================================================

# ── FastCGI cache zone ────────────────────────────────────────
# Stores PHP responses in RAM/disk so identical GET requests
# (e.g. product listings, config endpoints) don't hit PHP-FPM
# repeatedly. 1GB disk, 256MB RAM index.
# Add this OUTSIDE all server blocks (at http context level).
# If your nginx.conf already has a fastcgi_cache_path, remove this.
fastcgi_cache_path /var/cache/nginx/api
                   levels=1:2
                   keys_zone=api_cache:256m
                   max_size=1g
                   inactive=60m
                   use_temp_path=off;

fastcgi_cache_key "$scheme$request_method$host$request_uri";

# ── PHP-FPM upstream ─────────────────────────────────────────
upstream php_fpm {
    server unix:/run/php/php-fpm.sock;
    # Keep 32 persistent connections to PHP-FPM workers.
    # Without this nginx opens a new socket on every request.
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.tapeya.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.tapeya.com;

    ssl_certificate     /etc/letsencrypt/live/api.tapeya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tapeya.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # CORS: Laravel config/cors.php (HandleCors). OPTIONS reaches PHP for preflight.

    root              /var/www/tapeya/api/public;
    index             index.php;
    client_max_body_size 64M;

    access_log /var/log/nginx/api-access.log main buffer=32k flush=5s;
    error_log  /var/log/nginx/api-error.log warn;

    # ── Static public assets (storage, avatars, etc.) ─────────
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|pdf|zip|woff|woff2)$ {
        expires    30d;
        add_header Cache-Control "public";
        try_files  $uri =404;
    }

    # Laravel Reverb: browser WebSockets + Pusher HTTP API (POST /apps/.../events).
    location ^~ /app/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # No Connection: Upgrade here — Guzzle POST to /events must be normal HTTP.
    location ^~ /apps {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # YouTube embed proxy for iOS Capacitor (WKWebView iframes this page; must not send X-Frame-Options)
    location ^~ /embed/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Laravel routes ────────────────────────────────────────
    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass  php_fpm;
        fastcgi_keep_conn on;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include       fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # ── Timeouts ────────────────────────────────────────
        # Connect: fail fast if PHP-FPM is unresponsive.
        fastcgi_connect_timeout  10s;
        # Send/read: allow up to 120 s for heavy jobs (reports, exports).
        # For a typical JSON API 30–60 s is plenty; raise only if needed.
        fastcgi_send_timeout    120s;
        fastcgi_read_timeout    120s;

        # ── Buffers ─────────────────────────────────────────
        # Larger buffers keep the response in nginx RAM rather
        # than writing to a temp file, which kills latency.
        # 32 buffers × 16k = 512 kB per request – fine for JSON APIs.
        fastcgi_buffers         32 16k;
        fastcgi_buffer_size     64k;
        # Don't block if a single buffer overflows; just pass through.
        fastcgi_busy_buffers_size 128k;

        # ── PHP runtime values ───────────────────────────────
        fastcgi_param PHP_VALUE "
            upload_max_filesize = 64M
            post_max_size       = 64M
            memory_limit        = 256M
        ";

        # ── FastCGI micro-cache ──────────────────────────────
        # Cache only safe, non-authenticated GET responses for 10 s.
        # Even a 10-second cache eliminates thundering-herd on popular
        # endpoints (e.g. homepage products, public config).
        #
        # HOW TO BYPASS PER-ROUTE:
        #   In your Laravel middleware add:
        #     header('X-No-Cache: 1');
        #   nginx will skip both storing and serving from cache.
        #
        fastcgi_cache            api_cache;
        fastcgi_cache_valid       200 301 302 10s;
        fastcgi_cache_valid       404 1s;
        fastcgi_cache_min_uses    1;
        fastcgi_cache_use_stale   error timeout updating invalid_header
                                  http_500 http_503;
        # Allow one background request to refresh a stale entry
        # while still serving the cached copy instantly.
        fastcgi_cache_lock        on;
        fastcgi_cache_background_update on;

        # Never cache POST/PUT/PATCH/DELETE or authenticated requests.
        set $skip_cache 0;
        if ($request_method !~ ^(GET|HEAD)$) { set $skip_cache 1; }
        if ($http_authorization)             { set $skip_cache 1; }
        if ($cookie_laravel_session)         { set $skip_cache 1; }
        if ($http_x_no_cache)               { set $skip_cache 1; }
        if ($request_uri ~* ^/embed/)       { set $skip_cache 1; }

        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache     $skip_cache;

        # Expose cache status in response header for debugging.
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ── Security ──────────────────────────────────────────────
    location ~ /\.(?!well-known) { deny all; }
    location ~ ^/\.env            { deny all; }
    location ~ ^/storage/logs     { deny all; }
}
