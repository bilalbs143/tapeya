# api – api.tapeya.com (Laravel/PHP)

upstream php_fpm {
    server unix:/run/php/php-fpm.sock;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.tapeya.com;

    root /var/www/tapeya/api/public;
    index index.php;

    access_log /var/log/nginx/api-access.log;
    error_log  /var/log/nginx/api-error.log;
    client_max_body_size 64M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types application/json application/javascript application/xml text/plain text/css text/xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php_fpm;
        fastcgi_keep_conn on;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param PHP_VALUE "upload_max_filesize=64M \n post_max_size=64M";
    }

    location ~ /\.(?!well-known) { deny all; }
    location ~ ^/\.env { deny all; }
}
