# app – tapeya.com (React SPA)

server {
    listen 80;
    listen [::]:80;
    server_name tapeya.com;

    root /var/www/tapeya/app/dist;
    index index.html;

    access_log /var/log/nginx/app-access.log;
    error_log  /var/log/nginx/app-error.log;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers (X-Frame-Options set per-location — /embed/ must be iframe-able from Capacitor)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # YouTube embed proxy — public URL (tapeya.com) for YouTube Referer; Laravel renders via API.
    location = /embed/youtube {
        add_header Content-Security-Policy "frame-ancestors *" always;
        proxy_pass https://api.tapeya.com/embed/youtube$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host api.tapeya.com;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Other static files under /embed/ (if any)
    location ^~ /embed/ {
        add_header Content-Security-Policy "frame-ancestors *" always;
        try_files $uri =404;
    }

    # index.html: no long cache so users get updates after deploy
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Static assets: long cache (filenames usually hashed)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing
    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) { deny all; }
}
