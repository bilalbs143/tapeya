# ============================================================
# app – tapeya.com (React SPA) — production mirror
# Deploy to: /etc/nginx/sites-available/app.conf
# ============================================================

# www → apex (HTTP)
server {
    listen 80;
    listen [::]:80;
    server_name www.tapeya.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    location / {
        return 301 https://tapeya.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name tapeya.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    location / {
        return 301 https://tapeya.com$request_uri;
    }
}

# www → apex (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tapeya.com;

    ssl_certificate     /etc/letsencrypt/live/api.tapeya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tapeya.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://tapeya.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tapeya.com;

    ssl_certificate     /etc/letsencrypt/live/api.tapeya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tapeya.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    # ── HSTS ──────────────────────────────────────────────────
    # Tells browsers to always use HTTPS for 1 year.
    # Remove includeSubDomains if you have HTTP-only subdomains.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    root  /var/www/tapeya/app/dist;
    index index.html;

    access_log /var/log/nginx/app-access.log main buffer=16k flush=5s;
    error_log  /var/log/nginx/app-error.log warn;

    # ── index.html ────────────────────────────────────────────
    # Never cache the entry-point so users always get the latest
    # JS/CSS chunk filenames after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
        try_files $uri =404;
    }

    # ── Hashed static assets ──────────────────────────────────
    # React/Vite outputs filenames like main.a1b2c3d4.js.
    # These are safe to cache forever because the hash changes on deploy.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|map)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";

        # Serve pre-compressed .gz files if they exist (Vite --gzip plugin).
        # Falls through to nginx runtime gzip if not.
        gzip_static on;

        try_files $uri =404;

        # Security headers must be repeated inside location blocks
        # because add_header in the server block is NOT inherited
        # when the location block also sets add_header.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # YouTube embed proxy — public URL (tapeya.com) for YouTube Referer; Laravel on API renders it.
    # Use 127.0.0.1 (not api.tapeya.com): DNS points at Cloudflare, same-box proxy must loop back locally.
    location = /embed/youtube {
        proxy_pass https://127.0.0.1/embed/youtube$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host api.tapeya.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # CSP + no X-Frame-Options come from Laravel YouTubeEmbedProxyController
    }

    # Static embed assets (app/public/embed → dist/embed after vite build); exact /embed/youtube uses proxy above.
    location ^~ /embed/ {
        add_header Content-Security-Policy "frame-ancestors *" always;
        try_files $uri =404;
    }

    # Apple Universal Links + Android App Links (must be JSON, no SPA fallback).
    # Served from Vite public/.well-known → dist/.well-known after mobile web build.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # ── SPA fallback ──────────────────────────────────────────
    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ /index.html;
    }

    # ── Block hidden files ────────────────────────────────────
    location ~ /\.(?!well-known) { deny all; }
}
