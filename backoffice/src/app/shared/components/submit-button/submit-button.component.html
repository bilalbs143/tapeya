<button
  mat-flat-button
  [class]="className"
  [color]="color"
  [type]="buttonType"
  [disabled]="isSubmitting || disabled"
  [attr.cdkFocusInitial]="focusInitial ? '' : null"
  (click)="onClick()"
>
  @if (!isSubmitting) {
    {{ text }}
  }
  @if (isSubmitting) {
    <app-loader
      [diameter]="20"
      [tone]="'light'"
    />
  }
</button>
