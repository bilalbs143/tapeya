<div
  class="empty-state"
  [class.empty-state--overlay]="variant === 'overlay'"
>
  <span
    class="empty-state__icon"
    aria-hidden="true"
  >
    <i-tabler
      [name]="icon"
      class="size-4.5!"
    ></i-tabler>
  </span>
  <p class="empty-state__title">{{ message }}</p>
  @if (description) {
    <p class="empty-state__desc">{{ description }}</p>
  }
  @if (actionLabel) {
    <app-ui-button
      variant="secondary"
      size="sm"
      type="button"
      class="empty-state__action"
      (click)="action.emit()"
    >
      {{ actionLabel }}
    </app-ui-button>
  }
</div>
