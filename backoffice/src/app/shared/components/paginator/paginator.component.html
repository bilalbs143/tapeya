@if (loading) {
  <app-empty-data-message [message]="loadingMessage" />
} @else if ((length === 0 || length === undefined) && showNoRecMessage) {
  <app-empty-data-message [message]="noRecMessage" />
}

<mat-paginator
  [length]="length"
  [pageIndex]="pageIndex"
  [pageSize]="pageSize"
  [pageSizeOptions]="pageSizeOptions"
  [showFirstLastButtons]="showFirstLastButtons"
  [aria-label]="ariaLabel"
  (page)="page.emit($event)"
></mat-paginator>
