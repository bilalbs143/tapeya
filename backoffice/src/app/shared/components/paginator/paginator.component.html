@if (loading) {
  <p class="table-not-found-msg">
    {{ loadingMessage }}
  </p>
} @else if ((length === 0 || length === undefined) && showNoRecMessage) {
  <p class="table-not-found-msg">
    {{ noRecMessage }}
  </p>
}

<mat-paginator
  [length]="length"
  [pageIndex]="pageIndex"
  [pageSize]="pageSize"
  [pageSizeOptions]="pageSizeOptions"
  [showFirstLastButtons]="showFirstLastButtons"
  [aria-label]="ariaLabel"
  (page)="page.emit($event)"
></mat-paginator>
