<div class="dialog-wrapper__header">
  <h3 mat-dialog-title>{{ title }}</h3>
  @if (showClose) {
    <button
      type="button"
      mat-dialog-close
      class="dialog-wrapper__close"
      aria-label="Close Dialog"
    >
      <i-tabler
        name="x"
        class="dialog-wrapper__close-icon"
      ></i-tabler>
    </button>
  }
</div>

<ng-content></ng-content>
