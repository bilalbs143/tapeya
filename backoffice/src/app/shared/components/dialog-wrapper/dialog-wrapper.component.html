<div class="flex items-center justify-between px-5 pt-4">
  <h3>{{ title }}</h3>
  @if (showClose) {

      mat-icon-button
      mat-dialog-close
      class="flex! justify-center"
      aria-label="Close dialog"
    >
      <i-tabler
        name="x"
        class="size-5! flex!"
      ></i-tabler>
    </button>
  }
</div>
