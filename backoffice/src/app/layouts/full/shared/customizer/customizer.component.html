<div class="customizerNav">
  <ng-scrollbar
    class="relative"
    style="height: calc(100vh - 85px)"
  >
    <div class="p-6">
      <h6 class="text-base font-semibold mb-4!">Theme Option</h6>
      <mat-button-toggle-group
        #group="matButtonToggleGroup"
        [(ngModel)]="options.theme"
        (change)="setDark()"
        class="customizer-button-group gap-4"
        [hideSingleSelectionIndicator]="hideSingleSelectionIndicator()"
      >
        <mat-button-toggle [value]="'light'">
          <div class="flex items-center font-medium">
            <i-tabler
              name="sun-high"
              class="flex me-2 fill-icon"
            ></i-tabler>
            Light
          </div>
        </mat-button-toggle>
        <mat-button-toggle [value]="'dark'">
          <div class="flex items-center font-medium">
            <i-tabler
              name="moon"
              class="flex me-2 fill-icon"
            ></i-tabler>
            Dark
          </div>
        </mat-button-toggle>
      </mat-button-toggle-group>

      @if (!options.horizontal) {
        <div>
          <h6 class="text-base font-semibold mb-4! mt-6! pt-4">Sidebar type</h6>

          <mat-button-toggle-group
            #group="matButtonToggleGroup"
            [(ngModel)]="options.sidenavCollapsed"
            (change)="setSidebarCollapsed($event.value)"
            class="customizer-button-group gap-4"
            [hideSingleSelectionIndicator]="hideSingleSelectionIndicator()"
          >
            <mat-button-toggle [value]="false">
              <div class="flex items-center font-medium">
                <i-tabler
                  name="layout-sidebar-right"
                  class="flex me-2 fill-icon"
                ></i-tabler>
                Full
              </div>
            </mat-button-toggle>
            <mat-button-toggle [value]="true">
              <div class="flex items-center font-medium">
                <i-tabler
                  name="layout-sidebar"
                  class="flex me-2 fill-icon"
                ></i-tabler>
                Minisidebar
              </div>
            </mat-button-toggle>
          </mat-button-toggle-group>
        </div>
      }
      <h6 class="text-base font-semibold mb-4! mt-6! pt-4">Layout type</h6>

      <mat-button-toggle-group
        #group="matButtonToggleGroup"
        [(ngModel)]="options.horizontal"
        (change)="setHorizontal($event.value)"
        class="customizer-button-group gap-4"
        [hideSingleSelectionIndicator]="hideSingleSelectionIndicator()"
      >
        <mat-button-toggle [value]="false">
          <div class="flex items-center font-medium">
            <i-tabler
              name="layout-distribute-vertical"
              class="flex me-2 fill-icon"
            ></i-tabler>
            Vertical
          </div>
        </mat-button-toggle>
        <mat-button-toggle [value]="true">
          <div class="flex items-center font-medium">
            <i-tabler
              name="layout-distribute-horizontal"
              class="flex me-2 fill-icon"
            ></i-tabler>
            Horizontal
          </div>
        </mat-button-toggle>
      </mat-button-toggle-group>

      <h6 class="text-base font-semibold mb-4! mt-6! pt-4">Card with</h6>

      <mat-button-toggle-group
        #group="matButtonToggleGroup"
        [(ngModel)]="options.cardBorder"
        (change)="setCardBorder($event.value)"
        class="customizer-button-group gap-4"
        [hideSingleSelectionIndicator]="hideSingleSelectionIndicator()"
      >
        <mat-button-toggle [value]="false">
          <div class="flex items-center font-medium">
            <i-tabler
              name="shadow"
              class="flex me-2 fill-icon"
            ></i-tabler>
            Shadow
          </div>
        </mat-button-toggle>
        <mat-button-toggle [value]="true">
          <div class="flex items-center font-medium">
            <i-tabler
              name="shadow-off"
              class="flex me-2 fill-icon"
            ></i-tabler>
            Border
          </div>
        </mat-button-toggle>
      </mat-button-toggle-group>

      <h6 class="text-base font-semibold mb-4! mt-6! pt-4">Container Option</h6>

      <mat-button-toggle-group
        #group="matButtonToggleGroup"
        [(ngModel)]="options.boxed"
        (change)="setBoxed($event.value)"
        class="customizer-button-group gap-4"
        [hideSingleSelectionIndicator]="hideSingleSelectionIndicator()"
      >
        <mat-button-toggle [value]="false">
          <div class="flex items-center font-medium">
            <i-tabler
              name="layout-navbar"
              class="flex me-2 fill-icon"
            ></i-tabler>
            Full
          </div>
        </mat-button-toggle>
        <mat-button-toggle [value]="true">
          <div class="flex items-center font-medium">
            <i-tabler
              name="layout-sidebar"
              class="flex me-2 fill-icon"
            ></i-tabler>
            Boxed
          </div>
        </mat-button-toggle>
      </mat-button-toggle-group>
    </div>
  </ng-scrollbar>
</div>
