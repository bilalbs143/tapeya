<app-dialog-wrapper [title]="data.title">
  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    aria-label="Vendor Reason Form"
  >
    <mat-dialog-content>
      <p class="text-sm text-secondary m-0 mb-4">{{ data.message }}</p>
      <mat-form-field
        appearance="outline"
        class="w-full"
      >
        <mat-label
          >{{ data.reasonLabel ?? 'Reason' }}
          @if (data.reasonRequired) {
            <span class="text-error">*</span>
          }
        </mat-label>
        <textarea
          matInput
          formControlName="reason"
          rows="3"
          [placeholder]="data.reasonRequired ? 'Enter Reason' : 'Optional Notes'"
        ></textarea>
        @if (form.get('reason')?.hasError('required') && form.get('reason')?.touched) {
          <mat-error>Reason is required</mat-error>
        }
      </mat-form-field>
    </mat-dialog-content>

    <mat-divider></mat-divider>
    <mat-dialog-actions class="dialog-actions">
      <app-ui-button
        type="button"
        [mat-dialog-close]="null"
        variant="secondary"
      >
        Cancel
      </app-ui-button>
      <app-submit-button
        [text]="data.confirmText"
        color="primary"
      />
    </mat-dialog-actions>
  </form>
</app-dialog-wrapper>
