@if (isLoading) {
  <app-loader-block
    label="Loading tournament"
    class="py-16"
  />
} @else if (tournament) {
  <app-detail-page>
    <ng-container detailHeader>
      <app-page-header
        [title]="headerTitle"
        [subtitle]="headerSubtitle"
        [showFiltersToggle]="false"
      >
        <app-status-chip
          titleBadge
          [status]="tournament.status_enum ?? tournament.status"
          [label]="tournament.status_label || tournament.status"
        />
        <ng-container pageActions>
          @if (showAttachTeams) {
            <app-ui-button
              type="button"
              variant="primary"
              (click)="runAttachTeams()"
            >
              Attach Teams
            </app-ui-button>
          }
          @if (showScheduleMatch) {
            <app-ui-button
              type="button"
              variant="ghost"
              (click)="runClearMatchSearch()"
            >
              Clear Search
            </app-ui-button>
            <app-ui-button
              type="button"
              variant="secondary"
              (click)="runSearchMatches()"
            >
              Search
            </app-ui-button>
            <app-ui-button
              type="button"
              variant="primary"
              (click)="runScheduleMatch()"
            >
              Schedule Match
            </app-ui-button>
          }
          @if (showAddCampaign) {
            <app-ui-button
              type="button"
              variant="ghost"
              (click)="runClearCampaignSearch()"
            >
              Clear Search
            </app-ui-button>
            <app-ui-button
              type="button"
              variant="secondary"
              (click)="runSearchCampaigns()"
            >
              Search
            </app-ui-button>
            <app-ui-button
              type="button"
              variant="primary"
              (click)="runAddCampaign()"
            >
              Add Campaign
            </app-ui-button>
          }
          @if (showCreatePlayer) {
            <app-ui-button
              type="button"
              variant="primary"
              (click)="runCreatePlayer()"
            >
              Create New Player
            </app-ui-button>
          }
        </ng-container>
      </app-page-header>
    </ng-container>

    <nav
      detailTabs
      mat-tab-nav-bar
      [tabPanel]="tabPanel"
      mat-stretch-tabs="false"
      mat-align-tabs="start"
    >
      <a
        mat-tab-link
        routerLink="overview"
        routerLinkActive
        #rlaO="routerLinkActive"
        [active]="rlaO.isActive"
      >
        Overview
      </a>
      <a
        mat-tab-link
        routerLink="teams"
        routerLinkActive
        #rlaT="routerLinkActive"
        [active]="rlaT.isActive"
        [routerLinkActiveOptions]="{ paths: 'subset', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }"
      >
        Teams
      </a>
      <a
        mat-tab-link
        routerLink="matches"
        routerLinkActive
        #rlaM="routerLinkActive"
        [active]="rlaM.isActive"
      >
        Matches
      </a>
      <a
        mat-tab-link
        routerLink="interest-campaigns"
        routerLinkActive
        #rlaIC="routerLinkActive"
        [active]="rlaIC.isActive"
      >
        Interest Campaigns
      </a>
    </nav>

    <mat-tab-nav-panel
      detailBody
      #tabPanel
    >
      <router-outlet
        (activate)="onOutletActivate($event)"
        (deactivate)="onOutletDeactivate()"
      />
    </mat-tab-nav-panel>
  </app-detail-page>
}
