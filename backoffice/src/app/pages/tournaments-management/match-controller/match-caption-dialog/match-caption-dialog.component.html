<h2 mat-dialog-title>{{ data.caption ? 'Edit Caption' : 'Add Caption' }}</h2>
<mat-dialog-content>
  <form
    [formGroup]="form"
    class="flex flex-col gap-3 pt-1 min-w-[min(100%,420px)]"
    (ngSubmit)="save()"
  >
    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input
        matInput
        formControlName="title"
        autocomplete="off"
      />
      @if (form.controls.title.hasError('required') && form.controls.title.touched) {
        <mat-error>Title is required.</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea
        matInput
        formControlName="description"
        rows="5"
      ></textarea>
      @if (form.controls.description.hasError('required') && form.controls.description.touched) {
        <mat-error>Description is required.</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button
    mat-button
    type="button"
    (click)="cancel()"
    [disabled]="saving"
  >
    Cancel
  </button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="save()"
    [disabled]="saving || form.invalid"
  >
    {{ saving ? 'Saving…' : 'Save' }}
  </button>
</mat-dialog-actions>
