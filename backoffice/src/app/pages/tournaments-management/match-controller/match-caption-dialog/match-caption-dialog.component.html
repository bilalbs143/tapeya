<app-dialog-wrapper [title]="data.caption ? 'Edit Caption' : 'Add Caption'">
  <form
    [formGroup]="form"
    (ngSubmit)="save()"
  >
    <mat-dialog-content>
      <div class="grid grid-cols-12 gap-x-6 min-w-[min(100%,420px)]">
    <div class="col-span-12">
      <mat-label class="text-sm font-semibold mb-2 block">Title <span class="text-error">*</span></mat-label>
      <mat-form-field
        appearance="outline"
        class="w-full"
      >
        <input
          matInput
          formControlName="title"
          placeholder="Title"
          autocomplete="off"
        />
        @if (form.controls.title.hasError('required') && form.controls.title.touched) {
          <mat-error>Title is required.</mat-error>
        }
      </mat-form-field>
    </div>

    <div class="col-span-12">
      <mat-label class="text-sm font-semibold mb-2 block">Description <span class="text-error">*</span></mat-label>
      <mat-form-field
        appearance="outline"
        class="w-full"
      >
        <textarea
          matInput
          formControlName="description"
          rows="5"
          placeholder="Description"
        ></textarea>
        @if (form.controls.description.hasError('required') && form.controls.description.touched) {
          <mat-error>Description is required.</mat-error>
        }
      </mat-form-field>
    </div>
      </div>
    </mat-dialog-content>

    <mat-divider></mat-divider>
    <mat-dialog-actions>
      <button
        type="button"
        mat-stroked-button
        class="border border-error! text-error"
        [mat-dialog-close]="false"
      >
        Cancel
      </button>

      <app-submit-button
        [disabled]="form.invalid"
        [isSubmitting]="saving"
        text="Save"
        color="primary"
      />
    </mat-dialog-actions>
  </form>
</app-dialog-wrapper>
