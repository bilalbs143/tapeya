<app-dialog-wrapper [title]="title">
  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    aria-label="Submission Notes Form"
  >
    <mat-dialog-content>
      <div class="dialog-form">
        <p class="col-span-12 text-muted m-0 text-xs leading-relaxed">
          Internal admin notes for this interest submission. Not visible to the player.
        </p>
        <div class="col-span-12">
          <mat-form-field
            appearance="outline"
            class="w-full"
          >
            <mat-label>Notes</mat-label>
            <textarea
              matInput
              formControlName="notes"
              rows="6"
              placeholder="Add notes about this submission…"
            ></textarea>
            @if (form.controls.notes.hasError('maxlength') && form.controls.notes.touched) {
              <mat-error>Notes must be 5000 characters or fewer</mat-error>
            }
          </mat-form-field>
        </div>
      </div>
    </mat-dialog-content>

    <mat-divider></mat-divider>
    <mat-dialog-actions class="dialog-actions">
      <app-ui-button
        type="button"
        [mat-dialog-close]="false"
        variant="secondary"
      >
        Cancel
      </app-ui-button>
      <app-submit-button
        [disabled]="form.invalid"
        [isSubmitting]="isSubmitting"
        text="Save Notes"
        color="primary"
      />
    </mat-dialog-actions>
  </form>
</app-dialog-wrapper>
