@if (isLoading) {
  <app-loader-block
    label="Loading campaign"
    class="py-16"
  />
} @else if (campaign) {
  <div class="flex flex-col">
    <mat-card class="cardWithShadow mb-3!">
      <mat-card-content class="p-4 sm:p-6">
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div class="min-w-0">
            <h1 class="text-xl font-semibold m-0 truncate">{{ campaign.tournament_name }}</h1>
            <p class="text-sm text-muted m-0 mt-1">
              {{ campaign.is_linked ? 'Linked Tournament' : 'Custom Title' }}
            </p>
          </div>
          <span
            class="rounded-sm font-semibold px-2 py-1 text-xs shrink-0"
            [ngClass]="statusClass(campaign.status)"
          >
            {{ campaign.status_label }}
          </span>
        </div>

        <nav
          mat-tab-nav-bar
          [tabPanel]="tabPanel"
          mat-stretch-tabs="false"
          mat-align-tabs="start"
          class="mt-4 border-t border-border pt-1"
        >
          <a
            mat-tab-link
            routerLink="overview"
            routerLinkActive
            #rlaO="routerLinkActive"
            [active]="rlaO.isActive"
          >
            Overview
          </a>
          <a
            mat-tab-link
            routerLink="submissions"
            routerLinkActive
            #rlaS="routerLinkActive"
            [active]="rlaS.isActive"
          >
            Submissions
          </a>
        </nav>
      </mat-card-content>
    </mat-card>

    <mat-tab-nav-panel #tabPanel>
      <router-outlet />
    </mat-tab-nav-panel>
  </div>
}
