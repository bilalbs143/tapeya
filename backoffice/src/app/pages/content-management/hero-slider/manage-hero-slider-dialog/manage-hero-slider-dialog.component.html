<app-dialog-wrapper [title]="title">
  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    aria-label="Hero slide form"
  >
    <mat-dialog-content>
      <div class="grid grid-cols-12 gap-x-6">
        <div class="col-span-12">
          <app-file-upload
            formControlName="image_mobile"
            label="Mobile Image (default)"
            accept="image/jpeg,image/png,image/webp"
            acceptLabel="JPG, PNG, WebP"
            hint="Shown on mobile devices and used as fallback on desktop. 1200×628 px recommended."
            [required]="!isEdit"
            [maxSizeMb]="5"
          ></app-file-upload>
          @if (form.get('image_mobile')?.invalid && form.get('image_mobile')?.touched) {
            <p class="text-xs text-error mt-1 m-0">Mobile image is required.</p>
          }
        </div>

        <div class="col-span-12">
          <app-file-upload
            formControlName="image_desktop"
            label="Desktop Image"
            accept="image/jpeg,image/png,image/webp"
            acceptLabel="JPG, PNG, WebP"
            hint="Optional — app uses the mobile image if this is not set. 1920×600 px recommended."
            [maxSizeMb]="5"
          ></app-file-upload>
        </div>

        <div class="col-span-12">
          <mat-label class="text-sm font-semibold mb-2 block">Status <span class="text-error">*</span></mat-label>
          <mat-form-field
            appearance="outline"
            class="w-full"
          >
            <mat-select
              formControlName="status"
              placeholder="Select Status"
            >
              @if (statusOptions$ | async; as statusOptions) {
                @for (opt of statusOptions; track opt.value) {
                  <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
                }
              }
            </mat-select>
          </mat-form-field>
        </div>
      </div>
    </mat-dialog-content>

    <mat-divider></mat-divider>
    <mat-dialog-actions>
      <button
        type="button"
        mat-stroked-button
        class="border border-error! text-error"
        [mat-dialog-close]="false"
      >
        Cancel
      </button>

      <app-submit-button
        [disabled]="form.invalid"
        [isSubmitting]="isSubmitting"
        text="Submit"
        color="primary"
      />
    </mat-dialog-actions>
  </form>
</app-dialog-wrapper>
