<app-dialog-wrapper [title]="title">
  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    aria-label="Static Page Form"
  >
    <mat-dialog-content>
      <div class="dialog-form">
        <div class="col-span-12 lg:col-span-6">
          <mat-form-field
            appearance="outline"
            class="w-full"
          >
            <mat-label>Title</mat-label>
            <input
              matInput
              formControlName="title"
              placeholder="Page title"
            />
            @if (form.get('title')?.invalid && form.get('title')?.touched) {
              <mat-error>Title is required</mat-error>
            }
          </mat-form-field>
        </div>
        <div class="col-span-12 lg:col-span-6">
          <mat-form-field
            appearance="outline"
            class="w-full"
          >
            <mat-label>Slug</mat-label>
            <input
              matInput
              formControlName="slug"
              placeholder="Auto-generated from title (editable)"
            />
            @if (form.get('slug')?.invalid && form.get('slug')?.touched) {
              <mat-error>Slug is required</mat-error>
            }
          </mat-form-field>
        </div>
        <div class="col-span-12">
          <fieldset class="field-group-fieldset">
            <legend class="field-group-label">Content (HTML)</legend>
            <div class="NgxEditor__Wrapper">
              <ngx-editor-menu
                [editor]="editor"
                [toolbar]="toolbar"
              ></ngx-editor-menu>
              <ngx-editor
                [editor]="editor"
                formControlName="content"
                placeholder="Page body…"
                class="border-t"
              ></ngx-editor>
            </div>
          </fieldset>
        </div>
      </div>
    </mat-dialog-content>

    <mat-divider></mat-divider>
    <mat-dialog-actions class="dialog-actions">
      <app-ui-button
        type="button"
        [mat-dialog-close]="false"
        variant="secondary"
      >
        Cancel
      </app-ui-button>

      <app-submit-button
        [disabled]="form.invalid"
        [isSubmitting]="isSubmitting"
        [text]="data.mode === 'edit' ? 'Save Page' : 'Add Page'"
        color="primary"
      />
    </mat-dialog-actions>
  </form>
</app-dialog-wrapper>
