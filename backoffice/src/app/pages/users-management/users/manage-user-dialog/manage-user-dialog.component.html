<app-dialog-wrapper [title]="title">
  <form
    [formGroup]="form"
    (ngSubmit)="save()"
  >
    <mat-dialog-content>
      <div class="grid grid-cols-12 gap-x-6">
        <div class="col-span-12 lg:col-span-6">
          <mat-label class="text-sm font-semibold mb-2 block">Name</mat-label>
          <mat-form-field
            appearance="outline"
            class="w-full"
          >
            <input
              matInput
              formControlName="name"
              placeholder="Name"
            />
          </mat-form-field>
        </div>

        <div class="col-span-12 lg:col-span-6">
          <mat-label class="text-sm font-semibold mb-2 block">Email</mat-label>
          <mat-form-field
            appearance="outline"
            class="w-full"
          >
            <input
              matInput
              formControlName="email"
              placeholder="Email"
            />
          </mat-form-field>
        </div>

        <div class="col-span-12 lg:col-span-6">
          <mat-label class="text-sm font-semibold mb-2 block">Role</mat-label>
          <mat-form-field
            appearance="outline"
            class="w-full"
          >
            <mat-select formControlName="role">
              <mat-option value="Admin">Admin</mat-option>
              <mat-option value="Manager">Manager</mat-option>
              <mat-option value="Viewer">Viewer</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div class="col-span-12 lg:col-span-6">
          <mat-label class="text-sm font-semibold mb-2 block">Status</mat-label>
          <mat-form-field
            appearance="outline"
            class="w-full"
          >
            <mat-select formControlName="status">
              <mat-option value="active">Active</mat-option>
              <mat-option value="blocked">Blocked</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
    </mat-dialog-content>

    <mat-divider></mat-divider>
    <mat-dialog-actions>
      <button
        type="button"
        mat-stroked-button
        class="border border-error! text-error"
        mat-dialog-close
      >
        Cancel
      </button>

      <app-submit-button
        [disabled]="form.invalid"
        text="Submit"
        color="primary"
      />
    </mat-dialog-actions>
  </form>
</app-dialog-wrapper>
