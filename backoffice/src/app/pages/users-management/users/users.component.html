<mat-card class="cardWithShadow mb-3!">
  <mat-card-content class="p-6">
    <div class="grid grid-cols-12 gap-4 items-center">
      <div class="col-span-12 lg:col-span-4">
        <mat-form-field
          appearance="outline"
          class="w-full hide-hint"
        >
          <div class="flex gap-3 items-center">
            <i
              class="iconify size-5.5!"
              data-icon="solar:magnifer-line-duotone"
            ></i>
            <input
              matInput
              placeholder="Search users"
              [ngModel]="searchText"
              (ngModelChange)="applyFilter($event)"
            />
          </div>
        </mat-form-field>
      </div>

      <div class="col-span-12 lg:col-span-8 flex items-center justify-end">
        <button
          mat-flat-button
          color="primary"
          (click)="openCreateDialog()"
        >
          Add User
        </button>
      </div>
    </div>
  </mat-card-content>
</mat-card>

<mat-card class="cardWithShadow table-header-theme">
  <mat-card-content class="p-0">
    <div class="sticky-header-table-container relative overflow-auto">
      <app-table-wrapper>
        <table
          mat-table
          [dataSource]="dataSource"
          class="min-w-full"
        >
        <ng-container matColumnDef="id">
          <th
            mat-header-cell
            *matHeaderCellDef
            class="bg-light-secondary text-sm font-semibold"
          >
            #
          </th>
          <td
            mat-cell
            *matCellDef="let row"
            class="text-sm"
          >
            {{ row.id }}
          </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th
            mat-header-cell
            *matHeaderCellDef
            class="bg-light-secondary text-sm font-semibold"
          >
            Name
          </th>
          <td
            mat-cell
            *matCellDef="let row"
            class="text-sm whitespace-nowrap"
          >
            {{ row.name }}
          </td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th
            mat-header-cell
            *matHeaderCellDef
            class="bg-light-secondary text-sm font-semibold"
          >
            Email
          </th>
          <td
            mat-cell
            *matCellDef="let row"
            class="text-sm whitespace-nowrap"
          >
            {{ row.email }}
          </td>
        </ng-container>

        <ng-container matColumnDef="role">
          <th
            mat-header-cell
            *matHeaderCellDef
            class="bg-light-secondary text-sm font-semibold"
          >
            Role
          </th>
          <td
            mat-cell
            *matCellDef="let row"
            class="text-sm whitespace-nowrap"
          >
            {{ row.role }}
          </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th
            mat-header-cell
            *matHeaderCellDef
            class="bg-light-secondary text-sm font-semibold"
          >
            Status
          </th>
          <td
            mat-cell
            *matCellDef="let row"
            class="text-sm whitespace-nowrap"
          >
            @if (row.status === 'active') {
              <span class="bg-light-success text-success rounded-sm font-semibold px-1.5 py-1 text-xs">
                {{ row.status | titlecase }}
              </span>
            }
            @if (row.status === 'blocked') {
              <span class="bg-light-error text-error rounded-sm font-semibold px-1.5 py-1 text-xs">
                {{ row.status | titlecase }}
              </span>
            }
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th
            mat-header-cell
            *matHeaderCellDef
            class="bg-light-secondary text-sm font-semibold"
          >
            Action
          </th>
          <td
            mat-cell
            *matCellDef="let row"
            class="action-link text-sm whitespace-nowrap"
          >
            <a (click)="openEditDialog(row)" class="me-2.5 cursor-pointer">
              <i-tabler name="edit" class="size-4.5!"></i-tabler>
            </a>
            <a (click)="openDeleteDialog(row)" class="me-2.5 cursor-pointer">
              <i-tabler name="trash" class="size-4.5!"></i-tabler>
            </a>
          </td>
        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns; sticky: true"
        ></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
        ></tr>
      </table>
    </app-table-wrapper>
    </div>

    <app-paginator [length]="dataSource.data.length"></app-paginator>
  </mat-card-content>
</mat-card>
