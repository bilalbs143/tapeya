; Supervisor config for tapeya (api)
; Install: sudo cp supervisor/tapeya.conf /etc/supervisor/conf.d/ && sudo supervisorctl reread && sudo supervisorctl update

[program:artisan-scheduler]
process_name=%(program_name)s_%(process_num)03d
numprocs=1
directory=/var/www/tapeya/api
command=/bin/bash -c "cd /var/www/tapeya/api && /usr/bin/php artisan schedule:work"
autostart=true
autorestart=true
redirect_stderr=true
user=www-data
stdout_logfile=/var/www/tapeya/api/storage/logs/schedule.log
stderr_logfile=/var/www/tapeya/api/storage/logs/schedule_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:artisan-queue]
process_name=%(program_name)s_%(process_num)02d
numprocs=1
directory=/var/www/tapeya/api
command=/bin/bash -c "cd /var/www/tapeya/api && /usr/bin/php artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600"
autostart=true
autorestart=true
redirect_stderr=true
user=www-data
stdout_logfile=/var/www/tapeya/api/storage/logs/queue.log
stderr_logfile=/var/www/tapeya/api/storage/logs/queue_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:artisan-queue-push]
process_name=%(program_name)s_%(process_num)02d
numprocs=1
directory=/var/www/tapeya/api
command=/bin/bash -c "cd /var/www/tapeya/api && /usr/bin/php artisan queue:work --queue=push-notifications --sleep=3 --tries=3 --max-time=3600"
autostart=true
autorestart=true
redirect_stderr=true
user=www-data
stdout_logfile=/var/www/tapeya/api/storage/logs/queue-push.log
stderr_logfile=/var/www/tapeya/api/storage/logs/queue-push_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:artisan-reverb]
process_name=%(program_name)s
command=/bin/bash -c "cd /var/www/tapeya/api && /usr/bin/php artisan reverb:start --no-interaction"
directory=/var/www/tapeya/api
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=30
redirect_stderr=true
user=www-data
stdout_logfile=/var/www/tapeya/api/storage/logs/reverb.log
stderr_logfile=/var/www/tapeya/api/storage/logs/reverb_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
