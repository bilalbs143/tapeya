; Supervisor config for tapeya (api)
; Install: sudo cp supervisor/tapeya.conf /etc/supervisor/conf.d/ && sudo supervisorctl reread && sudo supervisorctl update

[program:artisan-scheduler]
process_name=%(program_name)s_%(process_num)03d
numprocs=1
directory=/var/www/tapeya/api
command=/bin/bash -c "cd /var/www/tapeya/api && /usr/bin/php artisan schedule:work"
autostart=true
autorestart=true
redirect_stderr=true
user=www-data
stdout_logfile=/var/www/tapeya/api/storage/logs/schedule.log
stderr_logfile=/var/www/tapeya/api/storage/logs/schedule_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:artisan-queue]
process_name=%(program_name)s_%(process_num)02d
numprocs=1
directory=/var/www/tapeya/api
command=/bin/bash -c "cd /var/www/tapeya/api && /usr/bin/php artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600 --max-jobs=100 --memory=256"
autostart=true
autorestart=true
stopwaitsecs=60
redirect_stderr=true
user=www-data
stdout_logfile=/var/www/tapeya/api/storage/logs/queue.log
stderr_logfile=/var/www/tapeya/api/storage/logs/queue_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:artisan-queue-push]
process_name=%(program_name)s_%(process_num)02d
numprocs=1
directory=/var/www/tapeya/api
command=/bin/bash -c "cd /var/www/tapeya/api && /usr/bin/php artisan queue:work --queue=push-notifications --sleep=3 --tries=3 --max-time=3600 --max-jobs=200 --memory=256"
autostart=true
autorestart=true
stopwaitsecs=60
redirect_stderr=true
user=www-data
stdout_logfile=/var/www/tapeya/api/storage/logs/queue-push.log
stderr_logfile=/var/www/tapeya/api/storage/logs/queue-push_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; Fast poster extraction — keep light and parallel for quick grid thumbnails.
[program:artisan-queue-reels-poster]
process_name=%(program_name)s_%(process_num)02d
numprocs=2
directory=/var/www/tapeya/api
command=/bin/bash -c "cd /var/www/tapeya/api && /usr/bin/php artisan queue:work --queue=reels-poster --sleep=1 --tries=3 --timeout=90 --max-time=3600 --max-jobs=50 --memory=512"
autostart=true
autorestart=true
stopwaitsecs=120
redirect_stderr=true
user=www-data
stdout_logfile=/var/www/tapeya/api/storage/logs/queue-reels-poster.log
stderr_logfile=/var/www/tapeya/api/storage/logs/queue-reels-poster_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; Heavy ABR/FFmpeg — single worker on one box; timeout aligned with posts.transcode_timeout_seconds (1800).
[program:artisan-queue-reels-transcode]
process_name=%(program_name)s_%(process_num)02d
numprocs=1
directory=/var/www/tapeya/api
command=/bin/bash -c "cd /var/www/tapeya/api && /usr/bin/php artisan queue:work --queue=reels-transcode --sleep=1 --tries=3 --timeout=1800 --max-time=3600 --max-jobs=10 --memory=1024"
autostart=true
autorestart=true
stopwaitsecs=1900
redirect_stderr=true
user=www-data
stdout_logfile=/var/www/tapeya/api/storage/logs/queue-reels-transcode.log
stderr_logfile=/var/www/tapeya/api/storage/logs/queue-reels-transcode_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; Media cleanup (delete originals / post media snapshots) — never block poster or encode.
[program:artisan-queue-reels]
process_name=%(program_name)s_%(process_num)02d
numprocs=1
directory=/var/www/tapeya/api
command=/bin/bash -c "cd /var/www/tapeya/api && /usr/bin/php artisan queue:work --queue=reels --sleep=2 --tries=3 --timeout=300 --max-time=3600 --max-jobs=100 --memory=256"
autostart=true
autorestart=true
stopwaitsecs=360
redirect_stderr=true
user=www-data
stdout_logfile=/var/www/tapeya/api/storage/logs/queue-reels.log
stderr_logfile=/var/www/tapeya/api/storage/logs/queue-reels_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:artisan-reverb]
process_name=%(program_name)s
command=/bin/bash -c "cd /var/www/tapeya/api && /usr/bin/php artisan reverb:start --no-interaction"
directory=/var/www/tapeya/api
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=30
redirect_stderr=true
user=www-data
stdout_logfile=/var/www/tapeya/api/storage/logs/reverb.log
stderr_logfile=/var/www/tapeya/api/storage/logs/reverb_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
