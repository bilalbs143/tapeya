; Supervisor — dev stack (separate paths and Reverb port from production).
; Install: sudo cp /var/www/dev-tapeya/supervisor/dev-tapeya.conf /etc/supervisor/conf.d/
;          sudo supervisorctl reread && sudo supervisorctl update

[program:dev-tapeya-scheduler]
process_name=%(program_name)s_%(process_num)03d
numprocs=1
directory=/var/www/dev-tapeya/api
command=/bin/bash -c "cd /var/www/dev-tapeya/api && /usr/bin/php artisan schedule:work"
autostart=true
autorestart=true
redirect_stderr=true
user=www-data
stdout_logfile=/var/www/dev-tapeya/api/storage/logs/schedule.log
stderr_logfile=/var/www/dev-tapeya/api/storage/logs/schedule_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:dev-tapeya-queue]
process_name=%(program_name)s_%(process_num)02d
numprocs=1
directory=/var/www/dev-tapeya/api
command=/bin/bash -c "cd /var/www/dev-tapeya/api && /usr/bin/php artisan queue:work database --sleep=3 --tries=3 --max-time=3600"
autostart=true
autorestart=true
redirect_stderr=true
user=www-data
stdout_logfile=/var/www/dev-tapeya/api/storage/logs/queue.log
stderr_logfile=/var/www/dev-tapeya/api/storage/logs/queue_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:dev-tapeya-reverb]
process_name=%(program_name)s
command=/bin/bash -c "cd /var/www/dev-tapeya/api && /usr/bin/php artisan reverb:start --no-interaction --port=8081"
directory=/var/www/dev-tapeya/api
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=30
redirect_stderr=true
user=www-data
stdout_logfile=/var/www/dev-tapeya/api/storage/logs/reverb.log
stderr_logfile=/var/www/dev-tapeya/api/storage/logs/reverb_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
