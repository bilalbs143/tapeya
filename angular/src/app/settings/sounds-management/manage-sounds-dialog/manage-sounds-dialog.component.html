<app-dialog-wrapper dialogTitle="MANAGE_SOUND">
  <form (ngSubmit)="onSubmit()" [formGroup]="form">
    <mat-dialog-content class="mat-typography mat-subtitle-2 lh-16">
      <div class="row">
        <div class="col-lg-12 d-flex align-items-center">
          <mat-label class="mat-subtitle-2 f-w-600 d-block m-b-12">{{
            'TITLE' | translate
          }}</mat-label>
        </div>
        <div class="col-lg-12">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>{{ 'TITLE' | translate }}</mat-label>
            <input
              matInput
              formControlName="title"
            />
            @if (formControls['title'].touched && formControls['title'].invalid) {
              <mat-hint class="m-b-16 error-msg">
                @if (formControls['title'].errors && formControls['title'].hasError('required')) {
                  <div class="text-error">
                    {{ 'TITLE_IS_REQUIRED' | translate }}
                  </div>
                }
              </mat-hint>
            }
          </mat-form-field>
        </div>
      </div>

      <div class="row">
        <div class="col-sm-12 d-flex align-items-center">
          <mat-label class="mat-subtitle-2 f-w-600 d-block m-b-12">{{
            'CHOOSE_FILE' | translate
          }}</mat-label>
        </div>
        <div class="col-sm-12">
          <button
            mat-flat-button
            type="button"
            class="input-file-button"
          >
            <input
              type="file"
              formControlName="file"
              (change)="onFileSelected($event)"
            />
          </button>
        </div>
      </div>
    </mat-dialog-content>

    <mat-divider></mat-divider>
    <mat-dialog-actions>
      <button mat-button class="b-1 border-error text-error" mat-dialog-close>
        {{ 'CANCEL' | translate }}
      </button>

      <app-submit-button
        [isSubmitting]="isSubmitting"
        [disabled]="form.invalid"
      ></app-submit-button>
    </mat-dialog-actions>
  </form>
</app-dialog-wrapper>
