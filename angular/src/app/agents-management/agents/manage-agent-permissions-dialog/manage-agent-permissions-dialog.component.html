<app-dialog-wrapper dialogTitle="AGENT_PERMISSIONS">
  <form (ngSubmit)="onSubmit()">
    <mat-dialog-content class="mat-typography mat-subtitle-2 lh-16">
      <mat-selection-list>
        @for (permission of permissions; track permission.key) {
          <mat-list-option [selected]="isSelected(permission.key)" (click)="togglePermission(permission.key)">
            {{ permission.label }}
          </mat-list-option>
        }
      </mat-selection-list>
    </mat-dialog-content>

    <mat-divider></mat-divider>
    <mat-dialog-actions>
      <button mat-button class="b-1 border-error text-error" mat-dialog-close>
        {{ 'CANCEL' | translate }}
      </button>

      <app-submit-button
        [isSubmitting]="isSubmitting"
        [disabled]="isSubmitting"
      ></app-submit-button>
    </mat-dialog-actions>
  </form>
</app-dialog-wrapper>
