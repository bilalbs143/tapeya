<app-dialog-wrapper dialogTitle="MANAGE_DOMAINS">
  <form (ngSubmit)="onSubmit()" [formGroup]="form">
    <mat-dialog-content class="mat-typography">
      <div formArrayName="domains">
        @for (domainGroup of domains.controls; track domainGroup; let i = $index) {
        <div [formGroupName]="i">
          <div class="row">
            <div class="col-lg-12">
              <mat-form-field appearance="outline" class="w-100 hide-hint">
                <mat-label>{{ 'DOMAIN' | translate }}</mat-label>
                <input matInput formControlName="domain" />
              </mat-form-field>
              <div class="manage-domains-action-btn">
                <a
                  href="javascript:"
                  mat-button
                  (click)="addDomain()"
                >
                  + {{ 'ADD' | translate }}
                </a>
                <a
                  href="javascript:"
                  mat-button
                  (click)="removeDomain(i)"
                  color="warn"
                >
                  - {{ 'REMOVE' | translate }}
                </a>
              </div>
            </div>
          </div>
        </div>
        }

        @if (domains.length === 0) {
          <div class="row">
            <div class="col-lg-12">
              <p class="m-t-0">{{ 'NO_DOMAIN_MESSAGE' | translate }}</p>
              <div class="manage-domains-action-btn">
                <a
                  href="javascript:"
                  mat-button
                  (click)="addDomain()"
                >
                  + {{ 'ADD' | translate }}
                </a>
              </div>
            </div>
          </div>
        }
      </div>
    </mat-dialog-content>

    <mat-divider></mat-divider>
    <mat-dialog-actions>
      <button mat-button class="b-1 border-error text-error" mat-dialog-close>
        {{ 'CANCEL' | translate }}
      </button>
      <app-submit-button [isSubmitting]="isSubmitting" [disabled]="form.invalid"></app-submit-button>
    </mat-dialog-actions>
  </form>
</app-dialog-wrapper>
