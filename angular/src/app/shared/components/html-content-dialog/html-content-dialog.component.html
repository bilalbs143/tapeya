<app-dialog-wrapper [dialogTitle]="title | translate">
  <mat-dialog-content class="mat-typography mat-subtitle-2 lh-16">
    <div [innerHTML]="content"></div>
  </mat-dialog-content>

  <mat-divider></mat-divider>
  <mat-dialog-actions>
    <button mat-button class="b-1 border-error text-error" mat-dialog-close>
      {{ 'CANCEL' | translate }}
    </button>
  </mat-dialog-actions>
</app-dialog-wrapper>
