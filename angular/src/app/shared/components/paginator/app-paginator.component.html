@if ((length === 0 || length === undefined) && showNoRecMessage) {
  <p
    class="table-not-found-msg d-flex align-items-center justify-content-center f-s-16 f-w-600"
  >
    {{ 'NO_RECORD_FOUND' | translate }}
  </p>
}


<mat-paginator
  [ngClass]="{
    hidden: length === 0 || length === undefined
  }"
  [length]="length"
  [pageSize]="pageSize"
  [pageSizeOptions]="pageSizeOptions"
  (page)="setPage($event)"
  showFirstLastButtons
>
</mat-paginator>
