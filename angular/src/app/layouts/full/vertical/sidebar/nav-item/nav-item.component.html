@if(!item.navCap && !item.external && !item.twoLines) {
  <a
    mat-list-item
    (click)="onItemSelected(item)"
    [ngClass]="{
      'mat-toolbar mat-primary activeMenu': item.route
        ? router.isActive(item.route, true)
        : false,
      expanded,
      disabled: item.disabled,
      child: isChild
    }"
    class="menu-list-item parentBox"
  >
    <i-tabler
      class="routeIcon"
      name="{{ item.iconName }}"
      matListItemIcon
    ></i-tabler>
    <span class="hide-menu">{{ item.displayName | translate }}</span>
    @if(item.children && item.children.length) {
      <span class="arrow-icon" fxFlex>
        <span fxFlex></span>
        <mat-icon [@indicatorRotate]="expanded ? 'expanded' : 'collapsed'">
          expand_more
        </mat-icon>
      </span>
    }
    @if(item.chip) {
      <span>
        <span
          class="{{ item.chipClass }} p-x-8 p-y-4 item-chip f-w-500 rounded-pill ">{{ item.chipContent }}</span>
      </span>
    }
  </a>
}

<!-- children -->
@if(expanded) {
  <div>
    @for(child of item.children; track child) {
      <app-nav-item
        [item]="child"
        (click)="onSubItemSelected(child)"
        [depth]="depth + 1"
        [isChild]="item.children && item.children.length"
      >
      </app-nav-item>
    }
  </div>
}
