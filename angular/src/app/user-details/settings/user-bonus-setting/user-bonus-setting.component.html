<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-card class="cardWithShadow m-b-10">
    <mat-card-content class="p-10">
      <h4 class="f-s-16 m-0 f-w-600 m-b-16">{{ 'BONUS' | translate }}</h4>
      <div class="row">
        <div class="col-sm-3">
          <div>
            <mat-checkbox formControlName="is_new_signup_first_recharge_bonus_enabled">{{ 'FIRST_DEPOSIT_BONUS_AFTER_SIGNUP' | translate }}</mat-checkbox>
          </div>
        </div>

        <div class="col-sm-3">
          <div>
            <mat-checkbox formControlName="is_first_recharge_bonus_of_day_enabled">{{ 'FIRST_DEPOSIT_BONUS_OF_THE_DAY' | translate }}</mat-checkbox>
          </div>
        </div>

        <div class="col-sm-3">
          <div>
            <mat-checkbox formControlName="is_bonus_per_recharge_enabled">{{ 'EVERY_DEPOSIT_BONUS' | translate }}</mat-checkbox>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-lg-12 d-flex align-items-center justify-content-end gap-8">
          <app-submit-button
            [isSubmitting]="isSubmitting"
            [disabled]="form.invalid"
          ></app-submit-button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</form>
