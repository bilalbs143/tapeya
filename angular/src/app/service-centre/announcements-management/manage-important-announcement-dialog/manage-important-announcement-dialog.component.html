<app-dialog-wrapper dialogTitle="IMPORTANT_ANNOUNCEMENT">
  <form (ngSubmit)="onSubmit()" [formGroup]="form">
    <mat-dialog-content class="mat-typography mat-subtitle-2 lh-16">
      <div class="row">
        <div class="col-lg-12 d-flex align-items-center">
          <mat-label class="mat-subtitle-2 f-w-600 d-block m-b-12">
            {{ 'CONTENT' | translate }}
          </mat-label>
        </div>
        <div class="col-lg-12">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>{{ 'ENTER_IMPORTANT_ANNOUNCEMENT' | translate }}</mat-label>
            <textarea
              matInput
              formControlName="content"
              rows="8"
              placeholder="{{ 'ENTER_IMPORTANT_ANNOUNCEMENT' | translate }}"
            ></textarea>
            @if (formControls['content'].touched && formControls['content'].invalid) {
              <mat-hint class="m-b-16 error-msg">
                @if (formControls['content'].errors && formControls['content'].hasError('required')) {
                  <div class="text-error">
                    {{ 'CONTENT_IS_REQUIRED' | translate }}
                  </div>
                }
              </mat-hint>
            }
          </mat-form-field>
        </div>
      </div>
    </mat-dialog-content>

    <mat-divider></mat-divider>
    <mat-dialog-actions>
      <button mat-button class="b-1 border-error text-error" mat-dialog-close>
        {{ 'CANCEL' | translate }}
      </button>

      <app-submit-button
        [isSubmitting]="isSubmitting"
        [disabled]="form.invalid || isLoading"
        [text]="currentImportantAnnouncement ? 'UPDATE' : 'SAVE'"
      ></app-submit-button>
    </mat-dialog-actions>
  </form>
</app-dialog-wrapper>
