<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tapeya" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link
      rel="icon"
      type="image/png"
      href="https://d1nmw2vhka3zp0.cloudfront.net/app/images/icons/tapeya-favicon-latest.png"
      sizes="512x512"
    />
    <link rel="apple-touch-icon" href="https://d1nmw2vhka3zp0.cloudfront.net/app/images/icons/tapeya-favicon-latest.png" />

    <!-- App fonts only (Montserrat, Moul). Graphics fonts load per-theme via themeRegistry. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Moul&display=swap"
      rel="stylesheet"
    />

    <!-- Warm the connection to the CloudFront CDN used for all app images -->
    <link rel="preconnect" href="https://d1nmw2vhka3zp0.cloudfront.net" />

    <title>Tapeya</title>

    <!-- OBS overlay: transparent background + Chrome 86 (vMix 24) polyfills from first paint -->
    <script>
      if (location.pathname.startsWith('/overlay/')) {
        document.documentElement.dataset.overlayRoute = '';

        // Guard third-party scripts (e.g. cached Meta Pixel) that use Array.prototype.at (Chrome 92+).
        if (!Array.prototype.at) {
          Array.prototype.at = function (index) {
            var n = Math.trunc(Number(index)) || 0;
            if (n < 0) n += this.length;
            if (n < 0 || n >= this.length) return undefined;
            return this[n];
          };
        }

        // Drop stale Meta Pixel state from a prior vMix browser session.
        try {
          delete window.fbq;
          delete window._fbq;
          delete window.__facebookPixelInitialized;
        } catch (e) {}

        // Block fbevents.js injection on overlay (defense in depth — app code also skips pixel init).
        function isFacebookScript(node) {
          if (!node || node.tagName !== 'SCRIPT') return false;
          var src = node.src || '';
          return /connect\.facebook\.net/i.test(src) || /fbevents\.js/i.test(src);
        }

        var appendChild = Node.prototype.appendChild;
        Node.prototype.appendChild = function (node) {
          if (isFacebookScript(node)) return node;
          return appendChild.call(this, node);
        };

        var insertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function (node, ref) {
          if (isFacebookScript(node)) return node;
          return insertBefore.call(this, node, ref);
        };
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
