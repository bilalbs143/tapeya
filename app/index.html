<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tapeya" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link
      rel="icon"
      type="image/png"
      href="https://d1nmw2vhka3zp0.cloudfront.net/app/images/icons/tapeya-favicon-latest.png"
      sizes="512x512"
    />
    <link rel="apple-touch-icon" href="https://d1nmw2vhka3zp0.cloudfront.net/app/images/icons/tapeya-favicon-latest.png" />

    <!-- App fonts only (Montserrat, Moul). Graphics fonts load per-theme via themeRegistry. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Moul&display=swap"
      rel="stylesheet"
    />

    <!-- Warm the connection to the CloudFront CDN used for all app images -->
    <link rel="preconnect" href="https://d1nmw2vhka3zp0.cloudfront.net" />

    <title>Tapeya</title>

    <!-- OBS overlay: transparent background from first paint -->
    <script>
      (function () {
        if (!location.pathname.startsWith('/overlay/')) return;
        document.documentElement.dataset.overlayRoute = '';
        if (!location.search.includes('overlayDebug=1')) return;
        document.addEventListener('DOMContentLoaded', function () {
          var el = document.createElement('div');
          el.id = 'overlay-debug-boot';
          el.style.cssText =
            'position:fixed;top:0;left:0;right:0;z-index:2147483647;background:rgba(80,0,0,0.92);color:#0f0;font:12px monospace;padding:8px;';
          el.textContent = 'HTML boot OK — loading JS module… ' + navigator.userAgent;
          document.body.appendChild(el);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
