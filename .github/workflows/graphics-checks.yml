name: Graphics checks

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  drift:
    name: Graphics drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install app dependencies
        run: npm install
        working-directory: app

      - name: Generate theme tokens
        run: npm run generate:tokens
        working-directory: app

      - name: Assert generated _tokens.css matches committed version
        run: git diff --exit-code -- 'app/src/graphics/themes/*/styles/_tokens.css'

      - name: Check graphics drift (manifest ↔ registry ↔ processors ↔ theme files)
        run: npm run check:graphics-drift
        working-directory: app

  graphics-tests:
    name: Graphics unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install app dependencies
        run: npm install
        working-directory: app

      - name: Run graphics tests
        run: npm run test -- --run
        working-directory: app

  graphics-typecheck:
    name: Graphics core typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install app dependencies
        run: npm install
        working-directory: app

      - name: Typecheck graphics core (checkJs)
        run: npm run typecheck:graphics
        working-directory: app

  graphics-visual:
    name: Graphics fixture smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install app dependencies
        run: npm install
        working-directory: app

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: app

      - name: Generate theme tokens
        run: npm run generate:tokens
        working-directory: app

      - name: Generate graphic HTML fixtures
        run: npm run generate:graphic-fixtures
        working-directory: app

      - name: Run Playwright fixture smoke tests
        run: npm run test:e2e:graphics
        working-directory: app

  manifest-export:
    name: PHP manifest export sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Prepare Laravel writable directories
        run: mkdir -p bootstrap/cache storage/framework/{cache,sessions,views} storage/logs
        working-directory: api

      - name: Install API dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: api

      - name: Export graphics manifest from PHP enum
        run: php artisan graphics:export-manifest
        working-directory: api

      - name: Assert manifest files match committed versions
        run: |
          git diff --exit-code shared/graphics-command-manifest.json
          git diff --exit-code shared/graphics-core/src/graphicCommandKeys.js

  graphics-build:
    name: Graphics build + output gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install app dependencies
        run: npm install
        working-directory: app

      - name: Generate theme tokens
        run: npm run generate:tokens
        working-directory: app

      - name: Build graphics artifact
        run: npm run build:graphics
        working-directory: app

      - name: Check graphics output (no color-mix / dvh)
        run: npm run check:graphics-output
        working-directory: app

      - name: Check graphics deps (no consumer bundles)
        run: npm run check:graphics-deps
        working-directory: app

  consumer-build:
    name: Consumer build excludes graphics bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install app dependencies
        run: npm install
        working-directory: app

      - name: Build consumer SPA
        run: npm run build
        working-directory: app

      - name: Assert no graphics runtime in consumer dist
        run: npm run check:consumer-no-graphics
        working-directory: app

  graphics-smoke:
    name: Graphics Playwright smoke
    runs-on: ubuntu-latest
    needs: graphics-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install app dependencies
        run: npm install
        working-directory: app

      - name: Generate theme tokens
        run: npm run generate:tokens
        working-directory: app

      - name: Build graphics artifact
        run: npm run build:graphics
        working-directory: app

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: app

      - name: Run graphics smoke (mocked session API)
        run: npm run test:e2e:graphics-smoke
        working-directory: app

  graphics-chrome86-smoke:
    name: Graphics Chrome 86 smoke
    runs-on: ubuntu-latest
    needs: graphics-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install app dependencies
        run: npm install
        working-directory: app

      - name: Generate theme tokens
        run: npm run generate:tokens
        working-directory: app

      - name: Build graphics artifact
        run: npm run build:graphics
        working-directory: app

      - name: Install Playwright Chromium (driver)
        run: npx playwright install chromium --with-deps
        working-directory: app

      - name: Cache Chrome 86
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/browsers
          key: chrome-86-0.4240.198-linux

      - name: Install Chrome 86 for vMix compatibility smoke
        run: npx --yes @puppeteer/browsers install chrome@86.0.4240.198 --path $RUNNER_TEMP/browsers
        working-directory: app

      - name: Run graphics smoke on Chrome 86
        env:
          CHROME_86_EXECUTABLE: ${{ runner.temp }}/browsers/chrome/linux-86.0.4240.198/chrome-linux64/chrome
        run: npm run test:e2e:graphics-smoke
        working-directory: app
