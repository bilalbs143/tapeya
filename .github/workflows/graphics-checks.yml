name: Graphics checks

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  drift:
    name: Graphics drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install overlay dependencies
        run: npm ci
        working-directory: app

      - name: Generate theme tokens
        run: npm run generate:tokens
        working-directory: app

      - name: Check graphics drift (manifest ↔ registry ↔ processors ↔ theme files)
        run: npm run check:graphics-drift
        working-directory: app

  overlay-tests:
    name: Overlay unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install overlay dependencies
        run: npm ci
        working-directory: app

      - name: Run overlay tests
        run: npm run test -- --run
        working-directory: app

  graphics-typecheck:
    name: Graphics core typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install overlay dependencies
        run: npm ci
        working-directory: app

      - name: Typecheck graphics core (checkJs)
        run: npm run typecheck:graphics
        working-directory: app

  graphics-visual:
    name: Graphics fixture smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install overlay dependencies
        run: npm ci
        working-directory: app

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: app

      - name: Generate theme tokens
        run: npm run generate:tokens
        working-directory: app

      - name: Generate graphic HTML fixtures
        run: npm run generate:graphic-fixtures
        working-directory: app

      - name: Run Playwright fixture smoke tests
        run: npm run test:e2e:graphics
        working-directory: app

  manifest-export:
    name: PHP manifest export sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install API dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: api

      - name: Export graphics manifest from PHP enum
        run: php artisan graphics:export-manifest
        working-directory: api

      - name: Assert manifest files match committed versions
        run: |
          git diff --exit-code shared/graphics-command-manifest.json
          git diff --exit-code app/src/graphics/core/graphicCommandKeys.js

  theme-controller:
    name: Theme-controller sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install theme-controller dependencies
        run: npm install
        working-directory: tapeya-theme-controller

      - name: Sync vendored themes (when monorepo sources present)
        run: npm run sync:vendor
        working-directory: tapeya-theme-controller

      - name: Generate wrappers
        run: npm run generate:wrappers
        working-directory: tapeya-theme-controller

      - name: Check theme-controller drift
        run: npm run check:drift
        working-directory: tapeya-theme-controller

      - name: Run theme-controller tests
        run: npm test
        working-directory: tapeya-theme-controller

      - name: Build theme-controller
        run: npm run build
        working-directory: tapeya-theme-controller
