name: Post / feed checks

on:
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/post-checks.yml'
  push:
    branches: [main, develop]
    paths:
      - 'api/**'
      - '.github/workflows/post-checks.yml'

jobs:
  post-tests:
    name: Feature/Post + unit Post tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tapeya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_pgsql, redis, gd, exif, bcmath

      - name: Prepare Laravel writable directories
        run: mkdir -p bootstrap/cache storage/framework/{cache,sessions,views} storage/logs
        working-directory: api

      - name: Install API dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: api

      - name: Run Post / feed test suite
        run: composer test:posts
        working-directory: api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: tapeya_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
